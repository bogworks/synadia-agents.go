# Mergify merge queue for bogworks/synadia-agents.go: a serial queue, one batch at a time, that merges a pull request only
# after the required checks pass; the comments below explain each choice.
# The checks named here are the go-sdk.yml pr-check job, the interop.yml interop-check job (interop with the official
# TypeScript and Python SDKs in both directions), the label-reset and adr-lint workflow jobs, and the codex-review
# commit status the review watcher posts.
merge_queue:
  mode: serial
  max_parallel_checks: 1

merge_protections_settings:
  auto_merge_conditions:
    - -draft
    - label != hold

# The ruleset requires the "Mergify Merge Protections" check, so this rule is what stops a merge outside the queue (a
# button or API merge by someone with bypass or write access) from skipping the review gates: a pull request to main
# merges only if it meets the same review conditions the queue requires, namely the watcher's codex-review, the
# maintainer's approval or the lead's `lead-approved` label, and no `hold`. The CI checks stay with the queue and the
# ruleset's own required checks. Mergify's own merge-queue drafts (the mergify/merge-queue/ branches) are exempt: they
# are Mergify's branches, not pull requests anyone reviews, and codex-review never runs on them; the pull request they
# batch has already passed these gates to enter the queue.
merge_protections:
  - name: review gates outside the queue
    description: A pull request to main merges, queue or not, only with codex-review, an approval (or lead-approved) and no hold.
    if:
      - base = main
      - -head ~= ^mergify/merge-queue/
    success_conditions:
      - label != hold
      - check-success = codex-review
      - or:
          - approved-reviews-by = randybias
          - label = lead-approved

queue_rules:
  - name: default
    # To enter the queue: CI green (pr-check), interop green (interop-check), label-reset and adr-lint (each runs on
    # every head, so a head without a green one cannot enter), the watcher's codex-review, and a recorded approval by the maintainer or the
    # lead's `lead-approved` label. Authorship is not a condition (agents push as the maintainer's login). `hold` is the brake.
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label != hold
      - check-success = codex-review
      - check-success = pr-check
      - check-success = label-reset
      - check-success = adr-lint
      - check-success = interop-check
      - or:
          - approved-reviews-by = randybias
          - label = lead-approved
    merge_conditions:
      - check-success = pr-check
      - check-success = interop-check
    batch_size:
      min: 1
      max: 5
    max_checks_retries: 1
    checks_timeout: 60 min
    # A merge commit through the pull request API: the branch ruleset requires a pull request, and this needs no bypass actor.
    merge_method: merge

priority_rules:
  - name: pipeline
    conditions:
      - label = pipeline
    priority: 4000
  - name: critical
    conditions:
      - label = critical
    priority: 3000
    allow_checks_interruption: true
  - name: docs
    conditions:
      - label = docs
    priority: 1000

pull_request_rules:
  - name: dismiss approvals when an outside author pushes
    conditions:
      - base = main
      - -author = randybias
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize
        message: "A new commit was pushed after this approval, so it is dismissed: a maintainer approves the new head."
  - name: docs label when every changed file is docs/** or *.md
    conditions:
      - base = main
      - "#files >= 1"
      - -files ~= ^(?!docs/|.*\.md$)
    actions:
      label:
        toggle:
          - docs
  - name: pipeline label when the pipeline changes
    conditions:
      - base = main
      - files ~= ^(\.github/|\.mergify\.yml$|scripts/)
    actions:
      label:
        add:
          - pipeline
  - name: label reverts critical
    conditions:
      - base = main
      - title ~= (?i)^revert
    actions:
      label:
        toggle:
          - critical
  - name: tell the author about a conflict
    conditions:
      - base = main
      - conflict
      - -closed
    actions:
      label:
        toggle:
          - conflict
      comment:
        message: "@{{author}} this pull request conflicts with main: rebase it onto origin/main and push; the review watcher reviews the new head."
  - name: tell the author about an ejection
    conditions:
      - queue-dequeue-reason = checks-failed
    actions:
      comment:
        message: "@{{author}} dequeued: the queue run of your pull request failed. Read the failing job and fix it in a new commit; Mergify queues it again once codex-review and pr-check pass."
