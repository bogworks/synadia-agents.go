#
# Release workflow (ADR 0002). Runs when a maintainer pushes a v<N.N.N> tag at a commit that passed the RELEASING.md
# checklist. It builds the cmd/sapconform binaries, makes a source archive, an SBOM of the module and SHA256SUMS,
# attests build provenance for every one of them, and attaches them to a GitHub release.
#
# Every job runs on [self-hosted, rh-linux] and nothing else; a tag push is never a fork pull request. Actions are
# pinned by full commit SHA and setup-go has cache: false; test/ci/workflows_test.go enforces both. The workflow's
# permissions are read-only. Only the attest job holds id-token and attestations write, and only the release job
# holds contents write.
#
# The attestation says that this workflow, at this tag, on a runner the maintainers operate, built these exact bytes.
# It does not say the runner was uncompromised. Verify with:
#   gh attestation verify <file> --repo bogworks/synadia-agents.go
#
# The binaries carry no -ldflags version stamp: the sapconform version is a constant in conformance/runner, and the
# Go build info records the module and commit.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  CYCLONEDX_GOMOD_VERSION: v1.9.0

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    timeout-minutes: 20
    runs-on: [self-hosted, rh-linux]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build sapconform
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -o "dist/sapconform-${GOOS}-${GOARCH}" ./cmd/sapconform
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sapconform-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sapconform-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  package:
    # The source archive, the SBOM and SHA256SUMS. The tag must be v<N.N.N> and CHANGELOG.md must carry a dated
    # section for it, so an unreleased tree cannot be tagged by mistake.
    needs: build
    timeout-minutes: 20
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Start from an empty dist
        run: rm -rf dist && mkdir dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sapconform-*
          path: dist
          merge-multiple: true
      - name: Check the tag against the changelog
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "not a version tag: $GITHUB_REF_NAME" >&2; exit 1; fi
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md || { echo "CHANGELOG.md has no dated section for ${version}" >&2; exit 1; }
      - name: Source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="synadia-agents.go-${GITHUB_REF_NAME}/" -o "dist/synadia-agents.go-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: SBOM of the module
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/tools" go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          "$RUNNER_TEMP/tools/cyclonedx-gomod" mod -json -licenses -output-version 1.5 -output "dist/synadia-agents.go-${GITHUB_REF_NAME}.cdx.json" .
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          [ "$(ls | wc -l | tr -d ' ')" = 5 ] || { echo "dist does not hold exactly three binaries, the archive and the SBOM" >&2; ls >&2; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  attest:
    # Build provenance for every release file, made in this job on our own runner. The three permissions belong to
    # this job only.
    needs: package
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Start from an empty dist
        run: rm -rf dist && mkdir dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  release:
    needs: [package, attest]
    timeout-minutes: 15
    runs-on: [self-hosted, rh-linux]
    permissions:
      contents: write
    steps:
      - name: Start from an empty dist
        run: rm -rf dist && mkdir dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            dist/sapconform-linux-amd64 dist/sapconform-linux-arm64 dist/sapconform-darwin-arm64 \
            "dist/synadia-agents.go-${GITHUB_REF_NAME}.tar.gz" "dist/synadia-agents.go-${GITHUB_REF_NAME}.cdx.json" \
            dist/SHA256SUMS
