#
# Architecture decision records are enforced on every pull request (internal/cmd/adrlint has the code,
# docs/decisions/README.md the rules): the records themselves are linted, an accepted record may not be rewritten
# (compared with the base branch), and the pull request body must carry one "Decision: none" or "Decision: ADR-NNNN"
# line that names a record this pull request adds or changes. "none" on a change to a protected path (the records, the
# merge queue, the workflows and actions, the linter and the CI guard test; see protected in
# internal/cmd/adrlint/main.go) needs the decision-confirmed label, which a reviewer applies; that is why labeled and
# unlabeled re-run it. The label counts only in a run whose event action is not synchronize, reopened or opened
# (PR_ACTION): on a push label-reset.yml removes it in a run that starts no new one, and this run may have read it
# first. The labels are read live (gh pr view), not from the event.
#
# Trust: this runs on pull_request_target, so GitHub runs THIS workflow file from the BASE branch; a pull request cannot
# edit it to pass its own gate. The checker is built from the base branch (checked out in trusted/) and pointed at the
# pull request's head (checked out in pr/) with --root. The pull request is data only: nothing from pr/ is ever built,
# sourced or run, no secret is used, and the token is contents: read (the label read needs nothing more). A pull
# request that changes this workflow or internal/cmd/adrlint is judged by the base branch's versions; its change takes
# effect once it has merged. (The first pull request that adds internal/cmd/adrlint has no checker at its base: the
# build step then skips, and the check passes only for that pull request.)
# This job runs on the gate runners ([self-hosted, rh-gate]); no GitHub-hosted runner is used. Its fork safety does not
# depend on the runner: the trust logic above is the same wherever it runs. The body and the labels reach the tool
# through env, never through the text of the shell script. A fork checkout may lack the base commit, so the base commit
# is fetched into pr/ from the trusted/ checkout (a local fetch, no network or credentials) as origin/<base>.
name: adr-lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: adr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adr-lint:
    name: adr-lint
    runs-on: [self-hosted, rh-gate]
    timeout-minutes: 10
    steps:
      - name: Check out the base branch (the trusted checker)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pull request (data only, never run)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the base branch into pr/ (from trusted/, locally)
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE/trusted" "+$BASE_SHA:refs/remotes/origin/$BASE_REF"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The gate only builds a tool, so it needs no particular Go: a seeded 1.27.x, never the module's
          # minimum (go-version-file resolves `go 1.26` to exactly 1.26.0, which no runner seeds).
          go-version: '1.27.x'
          check-latest: false
          cache: false
      - name: Build the checker from the base branch
        id: build
        working-directory: trusted
        run: |
          set -euo pipefail
          # Bootstrap: the pull request that adds the checker has no base checker to run. Once it is on the base
          # branch this always builds; a base without it is the only case that skips.
          if [ ! -d internal/cmd/adrlint ]; then
            echo "::notice::the base branch has no internal/cmd/adrlint yet; skipping (only the pull request that adds it)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go build -o "$RUNNER_TEMP/adrlint" ./internal/cmd/adrlint
      - name: Lint the records
        if: steps.build.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/adrlint" docs --root "$GITHUB_WORKSPACE/pr" --base "origin/$BASE_REF"
      - name: Check the pull request's decision
        if: steps.build.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The current labels, not the event payload's snapshot; an API error fails the step (set -e on the assignment).
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          export PR_LABELS="$labels"
          # --no-renames: a rename is listed as a delete plus an add, so the old path (say a protected one) is in the list.
          git -C "$GITHUB_WORKSPACE/pr" diff --no-renames --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/files"
          "$RUNNER_TEMP/adrlint" pr --root "$GITHUB_WORKSPACE/pr" --files "$RUNNER_TEMP/files"
