#
# CI for the Go SDK. Written as a single workflow so that it can be adopted
# upstream as a path-filtered go-sdk.yml (add a `paths:` filter for go/** then).
#
# Every job runs on self-hosted runners only, on one of exactly two label sets:
# [self-hosted, rh-linux] (build, test, lint) or [self-hosted, rh-gate] (the light
# changes and pr-check jobs, so they never queue behind a test job).
#
# Documentation changes do not run CI: the changes job (.github/scripts/changes.sh) says code=false for a docs-only
# pull request and the heavy jobs skip. Work is skipped, never checks: there is no `paths:` filter, because a required
# check that never reports stalls the merge queue. pr-check still runs and passes a skip only when changes said so. No GitHub-hosted
# runner, no other label; test/ci/workflows_test.go enforces this.
#
# pr-check is the single required check for branch protection and the merge queue.
# A pull request from a fork skips every other job (no untrusted code runs on a
# self-hosted runner); pr-check still runs, executes no checkout and no fork code,
# and fails because the needed jobs were skipped. A skipped required check would
# count as passing on GitHub, so pr-check must not skip itself.
name: go-sdk

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: go-sdk-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Decides whether the change needs the full run (see .github/scripts/changes.sh): code=false only for a docs-only pull
  # request. The heavy jobs wait on it and skip when it says false; pr-check/interop-check still run and still decide.
  # A plain git diff, no third-party action. Same fork guard as the other jobs: no fork code runs on a runner.
  changes:
    name: changes
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: [self-hosted, rh-gate]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The answer is code=true unless the base revision's own classifier says docs-only. The classifier is read
          # from the base, never run from the pull request checkout: a pull request must not be able to rewrite the
          # script that decides whether it gets checked.
          code=true
          if [ "$EVENT_NAME" = pull_request ]; then
            # --no-renames lists both sides of a rename, so a file moved out of a code path counts as code.
            files="$(git -c core.quotepath=off diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"
            if grep -q '^\.github/' <<<"$files"; then
              : # the CI itself changed (workflows, scripts, templates): always a full run
            elif git show "$BASE_SHA:.github/scripts/changes.sh" >"$RUNNER_TEMP/changes.sh" 2>/dev/null; then
              answer="$(bash "$RUNNER_TEMP/changes.sh" <<<"$files" || true)"
              [ "$answer" != code=false ] || code=false
            fi # no classifier on the base (this is the pull request that adds it): code=true
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (go ${{ matrix.go }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    env:
      # Run the Go that setup-go installed: the toolchain line in go.mod would
      # otherwise switch the 1.26.x leg to 1.27.4 and hide a break on 1.26.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test root module
        run: go test -race -count=1 ./...
      - name: Test integration module
        working-directory: test
        run: go test -race -count=1 -timeout 8m ./...

  vet:
    name: vet and gofmt (go ${{ matrix.go }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    env:
      # Run the Go that setup-go installed: the toolchain line in go.mod would
      # otherwise switch the 1.26.x leg to 1.27.4 and hide a break on 1.26.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: go vet (root module)
        run: go vet ./...
      - name: go vet (integration module)
        working-directory: test
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint root module
        run: golangci-lint run ./...
      - name: Lint integration module
        working-directory: test
        run: golangci-lint run --config ../.golangci.yml ./...

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan root module
        run: govulncheck ./...
      - name: Scan integration module
        working-directory: test
        run: govulncheck ./...

  tidy:
    name: go mod tidy
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Tidy both modules
        run: |
          go mod tidy
          (cd test && go mod tidy)
      - name: Fail on a diff
        run: |
          if ! git diff --exit-code -- go.mod go.sum test/go.mod test/go.sum; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' in the root and in test/."
            exit 1
          fi

  independence:
    name: independence check
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The SDK implements SAP 0.3 and nothing else. It must not import any
      # other github.com/bogworks/ module (its own module path is fine) and must
      # not carry identifiers or concepts from outside the protocol.
      - name: Check imports and identifiers
        shell: bash
        run: |
          set -u
          fail=0
          # docs/mash-mapping.md is the one exemption: it maps a downstream
          # consumer's code onto this SDK, so it has to name that consumer. It is
          # not part of the upstream landing. No other path is exempt.
          # Every tracked file is searched, not only *.go and *.md: grep -I skips
          # binary files, so any tracked text file (YAML, JSON, scripts, notices)
          # is covered. Names are NUL-separated so no path can split.
          files() { git ls-files -z -- ':(exclude).github' ':(exclude)docs/mash-mapping.md'; }

          echo "Checking imports of github.com/bogworks/ outside this module"
          if git ls-files -- '*.go' ':(exclude).github' | xargs -r grep -nE '"github\.com/bogworks/' \
              | grep -vE '"github\.com/bogworks/synadia-agents\.go(/|")'; then
            echo "error: import of a github.com/bogworks/ package outside this module"
            fail=1
          fi

          echo "Checking for identifiers from outside SAP 0.3"
          if files | xargs -0 -r grep -InE 'SignInstance|SignUrgent|SignInReplyTo|SignVia'; then
            echo "error: identifier from outside SAP 0.3"
            fail=1
          fi

          echo "Checking for concepts from outside SAP 0.3"
          # The consumer's name is searched in every tracked text file.
          if files | xargs -0 -r grep -InwiE 'mash'; then
            echo "error: 'mash' is not a protocol concept"
            fail=1
          fi
          # "zone" stays on Go and Markdown sources: a data fixture may carry
          # the word legitimately (an NTFS stream name). Go's time.Time.Zone()
          # and "time zone" are not the protocol concept.
          if git ls-files -z -- '*.go' '*.md' ':(exclude).github' ':(exclude)docs/mash-mapping.md' \
              | xargs -0 -r grep -InwiE 'zone' | grep -viE '\.Zone\(|time ?zone|no zone'; then
            echo "error: 'zone' used as a protocol concept"
            fail=1
          fi

          echo "Checking for a 'mail' verb or endpoint literal"
          if git ls-files -- '*.go' ':(exclude).github' ':(exclude)test/ci' | xargs -r grep -nE '"mail"'; then
            echo "error: 'mail' is not a SAP verb or endpoint name"
            fail=1
          fi

          exit "$fail"

  catalog:
    name: conformance catalog
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      # The catalog is checked against the pinned spec on every run. The
      # upstream docs repository carries no license that permits
      # redistribution, so the spec is fetched at the commit the catalog pins
      # and its sha256 (also pinned in the catalog) is verified before use.
      - name: Fetch the pinned spec
        shell: bash
        run: |
          if [ -d conformance ]; then
            set -euo pipefail
            pin() { sed -nE 's/^ *"'"$1"'": *"([^"]+)".*/\1/p' conformance/catalog.json | head -n1; }
            repo=$(pin repo); commit=$(pin commit); path=$(pin path); sha=$(pin sha256)
            [[ "$commit" =~ ^[0-9a-f]{40}$ && "$sha" =~ ^[0-9a-f]{64}$ && "$repo" == https://github.com/* ]]
            mkdir -p conformance/testdata/spec
            curl -fsSL --retry 3 -o conformance/testdata/spec/core-protocol.md \
              "https://raw.githubusercontent.com/${repo#https://github.com/}/${commit}/${path}"
            echo "${sha}  conformance/testdata/spec/core-protocol.md" | sha256sum -c -
          else
            echo "no conformance package yet"
          fi
      - name: Catalog test
        env:
          # A missing spec fails this job; it must never skip.
          SAP_REQUIRE_SPEC: 'true'
        run: if [ -d conformance ]; then go test -race -count=1 ./conformance/... -run TestCatalog; else echo "no conformance package yet"; fi

  mutate:
    name: mutation run
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      # Fail fast, before the heavy run, if a patch no longer applies.
      - name: Check that every patch applies
        run: go run ./internal/cmd/mutate -check
      - name: Mutation run
        run: go run ./internal/cmd/mutate

  # A docs-only change skips the heavy jobs but not the tests that read documentation (a Markdown file, anything under
  # docs/): test/docs checks docs/parity.md, docs/protocol-mapping.md, README.md and CHANGELOG.md against the code;
  # TestRepositoryADRsPass lints docs/decisions; TestQuickstart_ReadmeMatchesExample compares the README quick start
  # with the Example (a run on a name that does not exist yet passes, so it is safe before that test lands). None needs
  # a NATS server. It runs only when the heavy jobs did not (a code change runs them in test). test/ci guards that
  # every test that reads a Markdown file is run here.
  docs-guard:
    name: docs guard
    needs: changes
    if: needs.changes.outputs.code == 'false' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: [self-hosted, rh-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Docs tests (root module)
        run: |
          # go test -run passes when nothing matches, so require the named test to have run and passed.
          set -euo pipefail
          go test -count=1 -v -run '^TestRepositoryADRsPass$' ./internal/cmd/adrlint/ | tee "$RUNNER_TEMP/adrs.txt"
          grep -q '^--- PASS: TestRepositoryADRsPass ' "$RUNNER_TEMP/adrs.txt"
      - name: Docs tests (integration module)
        working-directory: test
        run: |
          set -euo pipefail
          go test -count=1 ./docs/...
          go test -count=1 -v -run '^TestQuickstart_ReadmeMatchesExample$' ./examples/ | tee "$RUNNER_TEMP/quickstart.txt"
          grep -q '^--- PASS: TestQuickstart_ReadmeMatchesExample ' "$RUNNER_TEMP/quickstart.txt"

  # The one required check. It needs every job above, runs even when one fails or
  # is skipped (always()), and passes only if every one did what it had to. It checks out
  # nothing, so a fork pull request runs no fork code here. A job may be skipped only
  # when the changes job succeeded and said so: the heavy jobs skip on a docs-only change
  # (code=false) and docs-guard skips on a code change (code=true). Any other skip (a fork
  # pull request, a failed changes job) fails, which holds the fork for a person.
  pr-check:
    name: pr-check
    needs: [changes, test, vet, lint, govulncheck, tidy, independence, catalog, mutate, docs-guard]
    if: always()
    timeout-minutes: 5
    runs-on: [self-hosted, rh-gate]
    steps:
      - name: Every required job did what it had to
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TEST: ${{ needs.test.result }}
          VET: ${{ needs.vet.result }}
          LINT: ${{ needs.lint.result }}
          VULN: ${{ needs.govulncheck.result }}
          TIDY: ${{ needs.tidy.result }}
          INDEPENDENCE: ${{ needs.independence.result }}
          CATALOG: ${{ needs.catalog.result }}
          MUTATE: ${{ needs.mutate.result }}
          DOCS_GUARD: ${{ needs.docs-guard.result }}
        run: |
          set -u
          fail=0
          echo "changes=$CHANGES code=$CODE"
          [ "$CHANGES" = success ] || fail=1
          # A heavy job: success, or skipped on a docs-only change (changes succeeded and said code=false).
          for kv in "test=$TEST" "vet=$VET" "lint=$LINT" "govulncheck=$VULN" "tidy=$TIDY" "catalog=$CATALOG" "mutate=$MUTATE"; do
            echo "$kv"
            r="${kv#*=}"
            if [ "$r" = success ]; then continue; fi
            if [ "$r" = skipped ] && [ "$CHANGES" = success ] && [ "$CODE" = false ]; then continue; fi
            fail=1
          done
          # independence runs on every change: success only.
          echo "independence=$INDEPENDENCE"
          [ "$INDEPENDENCE" = success ] || fail=1
          # docs-guard: success, or skipped on a code change (the test job runs the docs tests then).
          echo "docs-guard=$DOCS_GUARD"
          if [ "$DOCS_GUARD" != success ]; then
            if [ "$DOCS_GUARD" = skipped ] && [ "$CHANGES" = success ] && [ "$CODE" = true ]; then :; else fail=1; fi
          fi
          exit "$fail"
