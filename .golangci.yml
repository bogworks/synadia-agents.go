version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - containedctx
    - depguard
    - errname
    - errorlint
    - forbidigo
    - gosec
    - gochecknoinits
    - misspell
    - nolintlint
    - revive
    - sloglint
    - testableexamples
    - thelper
    - usetesting
  settings:
    depguard:
      rules:
        no-assertion-libraries:
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the testing package and go-cmp
    errcheck:
      check-type-assertions: true # product code only; _test.go is excluded below
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec: # used only where a repository enables gosec (rule 7)
      excludes:
        - G104 # unhandled errors: errcheck holds rule 13
    forbidigo:
      forbid:
        - pattern: ^os\.Exit$
          msg: only package main exits
        - pattern: ^log\.Fatal
          msg: only package main exits
        - pattern: ^fmt\.Print
          msg: only package main prints; log through slog
        - pattern: ^panic$
          msg: return an error; a deliberate panic needs a nolint reason
        - pattern: ^context\.Background$
          msg: only package main and tests start a context
        - pattern: ^context\.TODO$
          msg: pass the caller's context
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      static-msg: true
      key-naming-case: snake
  exclusions:
    rules:
      - path: ^(internal/)?cmd/|^examples/
        linters: [forbidigo]
        text: only package main
      - path: _test\.go$
        linters: [forbidigo]
        text: only package main|deliberate panic
      - linters: [errcheck]
        source: ^\s*defer\s.*\.Close\(\)$
      - path: _test\.go$
        linters: [errcheck]
        source: \.\( # a type assertion
      - path: _test\.go$
        linters: [gosec]
        text: '^G(101|204|304):'
      - path: _test\.go$
        linters: [thelper]
        source: '^\s*\{?.*\w+:\s*func\(\w+ \*testing\.[TB]\b'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
formatters:
  enable:
    - gofmt
    - goimports
